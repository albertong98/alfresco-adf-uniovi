<h2 mat-dialog-title>Crear expediente</h2>

<form [formGroup]="recordForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre">
            <mat-error *ngIf="recordForm.get('nombre')?.hasError('required')">
                El nombre es obligatorio
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Descripción</mat-label>
            <textarea matInput rows="4" formControlName="descripcion"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Responsable</mat-label>
            <input  matInput formControlName="responsable">
            <mat-error *ngIf="recordForm.get('responsable')?.hasError('required')">
                El responsable es obligatorio
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
            <mat-label>Centro</mat-label>
            <input matInput formControlName="centro">
            <mat-error *ngIf="recordForm.get('centro')?.hasError('required')">
                El centro es obligatorio
            </mat-error>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button mat-button type="button" (click)="onCancel()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit"> Crear</button>
    </mat-dialog-actions>

</form>
