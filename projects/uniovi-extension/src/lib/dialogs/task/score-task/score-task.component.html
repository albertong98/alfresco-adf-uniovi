<h2 mat-dialog-title>Calificar tarea</h2>

<form [formGroup]="scoreForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
        <mat-form-field appearance="outline" class="full-width">
            <mat-label>{{ 'UNIOVI.FORMS.TASK.SCORE.LABEL' | translate}}</mat-label>
            <input matInput type="number" formControlName="score">
            <mat-error *ngIf="recordForm.get('score')?.hasError('required') && recordForm.get('score')?.touched">
                {{ 'UNIOVI.FORMS.TASK.SCORE.ERROR' | translate}}
            </mat-error>
        </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions>
        <button mat-button type="button" (click)="onCancel()">{{ 'UNIOVI.FORMS.CANCEL' | translate}}</button>
        <button mat-raised-button color="primary" type="submit"> {{ 'UNIOVI.FORMS.CREATE' | translate}}</button>
    </mat-dialog-actions>
</form>
