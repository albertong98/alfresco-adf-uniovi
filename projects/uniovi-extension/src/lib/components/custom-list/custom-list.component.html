<aca-page-layout>
  <aca-page-layout-header class="smt-custom-list-layout-header">
    <div class="smt-custom-list-header">
      <h3 class="adf-breadcrumb">{{title | translate}}</h3>
    </div>
    <adf-toolbar class="adf-toolbar--inline">
      <ng-container *ngFor="let entry of actions; trackBy: trackByActionId">
        <aca-toolbar-action [actionRef]="entry"></aca-toolbar-action>
      </ng-container>
    </adf-toolbar>
  </aca-page-layout-header>
  <aca-page-layout-content>
    <div class="main-content">
      <div class="filters-container">
        
        <mat-form-field appearance="outline" *ngFor="let column of filters">
            <mat-label>{{column.title | translate}}</mat-label>
            <input *ngIf="column.search.type === 'text'" matInput [(ngModel)]="column.search.value">
            <input *ngIf="column.search.type === 'number'" type="number" matInput  [(ngModel)]="column.search.value">
            <mat-select  *ngIf="column.search.type === 'select'" [(ngModel)]="column.search.value">
              <mat-option
                *ngFor="let option of column.search.options"
                [value]="option" >
                {{option}}
              </mat-option>
            </mat-select>
            <ng-container *ngIf="column.search.type === 'date'">
                <input class="date-input" matInput [matDatepicker]="picker" [(ngModel)]="column.search.value">
                <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
            </ng-container>
        </mat-form-field>

        <button mat-raised-button color="primary" (click)="submitFilters()">
          {{'UNIOVI.FILTERS.APPLY' | translate}}
        </button>
        <button mat-raised-button color="primary" (click)="clearFilters()">
          {{'UNIOVI.FILTERS.CLEAR' | translate}}
        </button>
      </div>

      <adf-datatable #dataTable customList [display]="display" [loading]="isLoading" [allowFiltering]="allowFiltering" [contextMenu]="true"
        [selectionMode]="selectionMode" [stickyHeader]="stickyHeader" [multiselect]="multiselect" [data]="data"
        [showHeader]="showHeader" [showMainDatatableActions]="showMainDatatableActions" [actions]="true"
        [rowMenuCacheEnabled]="true" (rowDblClick)="onRowDbClick($any($event).value?.node)"
        (row-select)="onNodeSelect($any($event).detail)" (row-unselect)="onNodeUnselect($any($event).detail)"
        (sorting-changed)="onSortingChanged($any($event))" (showRowActionsMenu)="onShowRowActionsMenu($event)"
        (executeRowAction)="onExecuteRowAction($event)">
        <adf-no-content-template>
          <ng-template>
            <adf-empty-list *ngIf="!customNoContentTemplate">
              <div class="adf-empty-list_template adf-empty-folder">
                <div class="adf-empty-folder-this-space-is-empty">{{'ADF-DOCUMENT-LIST.EMPTY.HEADER' | translate}}</div>
                <div fxHide.lt-md="true" class="adf-empty-folder-drag-drop">{{ 'ADF-DATATABLE.EMPTY.DRAG-AND-DROP.TITLE'
                  |
                  translate }}</div>
                <div fxHide.lt-md="true" class="adf-empty-folder-any-files-here-to-add">{{
                  'ADF-DATATABLE.EMPTY.DRAG-AND-DROP.SUBTITLE' | translate }}</div>
                <img [alt]="'ADF-DATATABLE.EMPTY.DRAG-AND-DROP.TITLE' | translate" class="adf-empty-folder-image"
                  [src]="emptyFolderImageUrl">
              </div>
            </adf-empty-list>
            <ng-content select="adf-custom-empty-content-template, empty-folder-content"></ng-content>
          </ng-template>
        </adf-no-content-template>

        <adf-loading-content-template>
          <ng-template>
            <div class="adf-document-list-loading-container" *ngIf="!customLoadingContent">
              <mat-progress-spinner id="adf-document-list-loading" class="adf-document-list-loading-margin"
                [color]="'primary'" [mode]="'indeterminate'">
              </mat-progress-spinner>
            </div>
            <ng-content select="adf-custom-loading-content-template"></ng-content>
          </ng-template>
        </adf-loading-content-template>

        <data-columns>
          <data-column *ngFor="let column of columns" [key]="column.key" [title]="column.title"
            [sortable]="column.sortable">
          </data-column>
        </data-columns>
      </adf-datatable>
    </div>
  </aca-page-layout-content>
</aca-page-layout>
