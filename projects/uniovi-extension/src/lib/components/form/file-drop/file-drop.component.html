<div
    class="drop-zone"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    [class.drag-over]="isDragOver">

    <mat-icon>upload_file</mat-icon>
    <p>Arrastre documentos aquí</p>
    <input #fileInput type="file" multiple hidden (change)="onFilesSelected($event)">

    <button mat-stroked-button type="button" (click)="fileInput.click()">
        Seleccionar archivos
    </button>

</div>

<mat-list *ngIf="selectedFiles.length">
    <mat-list-item *ngFor="let file of selectedFiles">
        {{ file.name }}
        <button mat-icon-button type="button" (click)="removeFile(file)">
            <mat-icon>close</mat-icon>
        </button>
    </mat-list-item>
</mat-list>
